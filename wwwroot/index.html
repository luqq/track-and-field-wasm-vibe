<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Track &amp; Field (1983) — .NET 10 WASM</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* Native 256x224 backbuffer, GPU-scaled with nearest-neighbour sampling */
        #screen {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: min(100vw, calc(100vh * 256 / 224));
            height: min(100vh, calc(100vw * 224 / 256));
            aspect-ratio: 256 / 224;
        }
    </style>
</head>
<body>
    <canvas id="screen" width="256" height="224"></canvas>
    <script type="module" src="./main.js"></script>
</body>
</html>
