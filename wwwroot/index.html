<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prank + Yield — .NET 10 WASM</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* Native 256x224 backbuffer, GPU-stretched to fill the screen with
           nearest-neighbour sampling — CRTs stretched the signal too */
        #screen {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="screen" width="256" height="224"></canvas>
    <script type="module" src="./main.js"></script>
</body>
</html>
